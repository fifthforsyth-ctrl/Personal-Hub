# The Hub app for Apple Watch. setup.sh turns this into HubWatch.xcodeproj
# (with XcodeGen) after writing your watch address and signing settings.
name: HubWatch
options:
  deploymentTarget:
    watchOS: "10.0"
  createIntermediateGroups: true
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_PREVIEWS: NO
targets:
  HubWatch:
    type: application
    platform: watchOS
    sources:
      - path: HubWatch
      - path: Shared
    dependencies:
      - target: HubWidget
    settings:
      base:
        PRODUCT_NAME: Hub
        PRODUCT_BUNDLE_IDENTIFIER: $(HUB_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
    info:
      path: HubWatch/Info.plist
      properties:
        CFBundleDisplayName: Hub
        WKApplication: true
        WKWatchOnly: true
        CFBundleURLTypes:
          - CFBundleURLName: hubwatch
            CFBundleURLSchemes: [hubwatch]
    scheme: {}
  HubWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: HubWidget
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: HubWidget
        PRODUCT_BUNDLE_IDENTIFIER: $(HUB_BUNDLE_ID).widget
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
    info:
      path: HubWidget/Info.plist
      properties:
        CFBundleDisplayName: Hub
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
